<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ducati Glass Launcher</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            clock: ['"Teko"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    /* Ducati Tail Silhouette & Tire Background */
    .bg-launcher {
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(220, 20, 60, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 65%, rgba(220, 20, 60, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, rgba(5,7,6,0.65) 0%, rgba(5,7,6,0.4) 40%, rgba(5,7,6,0.85) 100%),
        url('https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?q=80&w=1200&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    /* Racing Outlined Font FX */
    .clock-white {
      color: transparent;
      -webkit-text-stroke: 3px #ffffff;
      text-shadow: 0 0 15px rgba(255,255,255,0.4);
    }
    .clock-red {
      color: transparent;
      -webkit-text-stroke: 3px #ff1a2d;
      text-shadow: 0 0 20px rgba(255, 26, 45, 0.6);
    }
    /* Frosted Glass */
    .glass-capsule {
      background: rgba(22, 26, 28, 0.55);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .glass-icon {
      position: relative;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.35);
    }
    .glass-icon:active {
      transform: scale(0.90);
      filter: brightness(1.2);
    }
    .glass-icon::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 100%);
      border-radius: inherit;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black text-white flex justify-center items-center h-screen w-screen">

  <div class="relative w-full h-full max-w-md bg-launcher flex flex-col justify-between p-5 pt-8 pb-7 shadow-2xl overflow-hidden">
    
    <!-- Top System Bar -->
    <div class="flex justify-between items-center px-2 text-xs font-semibold tracking-wider text-neutral-300 z-10">
      <div class="flex items-center gap-1.5">
        <span id="statusBarTime">01:17</span>
        <i class="fa-solid fa-location-arrow text-[10px] text-neutral-400"></i>
      </div>
      <div class="w-20 h-4 bg-neutral-900/90 rounded-full border border-neutral-700/50 flex items-center justify-between px-2">
        <div class="w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-blue-500/80"></div>
      </div>
      <div class="flex items-center gap-2 text-neutral-300">
        <i class="fa-solid fa-signal text-[11px]"></i>
        <span class="text-[10px]">5G</span>
        <i class="fa-solid fa-wifi text-[11px]"></i>
        <div class="flex items-center gap-0.5">
          <span class="text-[10px]">88%</span>
          <i class="fa-solid fa-battery-three-quarters text-xs"></i>
        </div>
      </div>
    </div>

    <!-- Clock & Motorcycle Telemetry Widget -->
    <div class="mt-2 z-10 px-2">
      <div class="flex items-baseline font-clock text-7xl sm:text-8xl tracking-tighter leading-none select-none">
        <span id="clockHour" class="clock-white mr-1">01</span>
        <span id="clockMinute" class="clock-red">17</span>
      </div>

      <div class="flex items-center justify-between mt-1">
        <div>
          <div id="dateDisplay" class="font-extrabold text-2xl tracking-wider uppercase text-white drop-shadow-md">
            TUE, OCT 6
          </div>
          <div class="flex items-center gap-1.5 text-xs text-neutral-300 font-medium mt-0.5">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
            <span>Panigale V4 S</span>
            <span class="text-neutral-500">•</span>
            <span class="text-emerald-400 font-semibold">Ready to Ride</span>
          </div>
        </div>

        <!-- Weather / Track Pill -->
        <div class="glass-capsule rounded-full px-3.5 py-1.5 flex items-center gap-2 text-xs">
          <i class="fa-solid fa-cloud-sun text-amber-400 text-sm"></i>
          <span class="font-bold text-white">28°C</span>
          <span class="text-neutral-500">|</span>
          <i class="fa-solid fa-gauge-high text-red-500 text-xs"></i>
          <span class="font-medium text-neutral-200">Track Dry</span>
        </div>
      </div>
    </div>

    <!-- Center App Grid (2 Rows x 4 Columns) -->
    <div class="grid grid-cols-4 gap-y-6 gap-x-3 px-1 my-auto z-10">
      
      <!-- App 1: MyJPJ -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer app-item" onclick="handleAppClick('MyJPJ')">
        <div class="w-16 h-16 rounded-[22px] bg-gradient-to-br from-blue-700 via-indigo-900 to-black glass-icon flex flex-col items-center justify-center border border-blue-400/40">
          <span class="text-[9px] font-bold text-amber-400 tracking-wider">MY</span>
          <span class="text-sm font-black italic text-cyan-200 tracking-tighter -mt-1">JPJ</span>
        </div>
        <span class="text-xs font-medium text-neutral-200 drop-shadow">MyJPJ</span>
      </div>

      <!-- App 2: Ducati Link -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer app-item" onclick="handleAppClick('Ducati Link')">
        <div class="w-16 h-16 rounded-[22px] bg-gradient-to-br from-red-600 to-red-950 glass-icon flex items-center justify-center border border-red-400/40">
          <i class="fa-solid fa-motorcycle text-2xl text-white"></i>
        </div>
        <span class="text-xs font-medium text-neutral-200 drop-shadow">Ducati Link</span>
      </div>

      <!-- App 3: Maps / Track -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer app-item" onclick="handleAppClick('Maps')">
        <div class="w-16 h-16 rounded-[22px] bg-gradient-to-br from-emerald-500 to-teal-900 glass-icon flex items-center justify-center border border-emerald-400/40">
          <i class="fa-solid fa-map-location-dot text-2xl text-white"></i>
        </div>
        <span class="text-xs font-medium text-neutral-200 drop-shadow">Maps</span>
      </div>

      <!-- App 4: Photos -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer app-item" onclick="handleAppClick('Photos')">
        <div class="w-16 h-16 rounded-[22px] bg-gradient-to-br from-purple-800 to-slate-950 glass-icon flex items-center justify-center border border-purple-400/40">
          <div class="grid grid-cols-2 gap-1 p-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-sky-400"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
          </div>
        </div>
        <span class="text-xs font-medium text-neutral-200 drop-shadow">Photos</span>
      </div>

      <!-- App 5: Music -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer app-item" onclick="handleAppClick('Music')">
        <div class="w-16 h-16 rounded-[22px] bg-gradient-to-br from-rose-600 via-pink-800 to-neutral-950 glass-icon flex items-center justify-center border border-pink-400/40">
          <i class="fa-solid fa-music text-2xl text-white"></i>
        </div>
        <span class="text-xs font-medium text-neutral-200 drop-shadow">Music</span>
      </div>

      <!-- App 6: Telemetry -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer app-item" onclick="handleAppClick('Telemetry')">
        <div class="w-16 h-16 rounded-[22px] bg-gradient-to-br from-neutral-800 to-neutral-950 glass-icon flex items-center justify-center border border-neutral-600/40">
          <i class="fa-solid fa-heart-pulse text-2xl text-red-500"></i>
        </div>
        <span class="text-xs font-medium text-neutral-200 drop-shadow">Telemetry</span>
      </div>

      <!-- App 7: Weather -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer app-item" onclick="handleAppClick('Weather')">
        <div class="w-16 h-16 rounded-[22px] bg-gradient-to-br from-sky-500 to-blue-950 glass-icon flex items-center justify-center border border-sky-400/40">
          <i class="fa-solid fa-bolt text-2xl text-white"></i>
        </div>
        <span class="text-xs font-medium text-neutral-200 drop-shadow">Weather</span>
      </div>

      <!-- App 8: Settings -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer app-item" onclick="handleAppClick('Settings')">
        <div class="w-16 h-16 rounded-[22px] bg-gradient-to-br from-neutral-700 to-neutral-900 glass-icon flex items-center justify-center border border-neutral-500/40">
          <i class="fa-solid fa-gear text-2xl text-neutral-200"></i>
        </div>
        <span class="text-xs font-medium text-neutral-200 drop-shadow">Settings</span>
      </div>

    </div>

    <!-- Page Indicator Dots -->
    <div class="flex justify-center items-center gap-1.5 mb-2 z-10">
      <div class="w-2 h-2 rounded-full bg-white shadow-sm"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
    </div>

    <!-- Bottom Dock Capsule -->
    <div class="glass-capsule rounded-[32px] p-2.5 px-3 flex justify-between items-center z-10">
      
      <!-- Phone -->
      <div class="w-14 h-14 rounded-[18px] bg-gradient-to-br from-emerald-500 to-emerald-700 glass-icon flex items-center justify-center cursor-pointer" onclick="handleAppClick('Phone')">
        <i class="fa-solid fa-phone text-xl text-white"></i>
      </div>

      <!-- Contacts -->
      <div class="w-14 h-14 rounded-[18px] bg-gradient-to-br from-cyan-400 to-teal-600 glass-icon flex items-center justify-center cursor-pointer" onclick="handleAppClick('Contacts')">
        <i class="fa-solid fa-user text-xl text-white"></i>
      </div>

      <!-- Messages (with badge) -->
      <div class="relative w-14 h-14 rounded-[18px] bg-gradient-to-br from-sky-400 to-blue-600 glass-icon flex items-center justify-center cursor-pointer" onclick="handleAppClick('Messages')">
        <i class="fa-solid fa-comment text-xl text-white"></i>
        <span class="absolute -top-1.5 -right-1.5 bg-red-600 text-white font-extrabold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-neutral-900 shadow">
          50
        </span>
      </div>

      <!-- Browser / Safari -->
      <div class="w-14 h-14 rounded-[18px] bg-gradient-to-br from-blue-500 to-indigo-700 glass-icon flex items-center justify-center cursor-pointer" onclick="handleAppClick('Browser')">
        <i class="fa-solid fa-compass text-xl text-white"></i>
      </div>

      <!-- Camera -->
      <div class="w-14 h-14 rounded-[18px] bg-gradient-to-br from-neutral-800 to-black glass-icon flex items-center justify-center cursor-pointer border border-neutral-600/40" onclick="handleAppClick('Camera')">
        <div class="w-7 h-7 rounded-full border-2 border-neutral-400 flex items-center justify-center">
          <div class="w-2.5 h-2.5 rounded-full bg-neutral-300"></div>
        </div>
      </div>

    </div>

    <!-- Android Home Indicator / Navigation Pill -->
    <div class="w-32 h-1 bg-white/40 rounded-full mx-auto mt-2"></div>

    <!-- Toast Notification for Haptic Feedback -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 glass-capsule px-4 py-2 rounded-full text-xs font-semibold text-white tracking-wide opacity-0 transition-opacity duration-300 pointer-events-none z-50">
      Launching...
    </div>

  </div>

  <script>
    // Live Clock & Date Update
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      
      const hourEl = document.getElementById('clockHour');
      const minuteEl = document.getElementById('clockMinute');
      const statusTimeEl = document.getElementById('statusBarTime');
      
      if (hourEl) hourEl.textContent = hours;
      if (minuteEl) minuteEl.textContent = minutes;
      if (statusTimeEl) statusTimeEl.textContent = `${hours}:${minutes}`;

      // Date Format: TUE, OCT 6
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
      const dateString = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
      
      const dateEl = document.getElementById('dateDisplay');
      if (dateEl) dateEl.textContent = dateString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Haptic & Click Simulation
    function handleAppClick(appName) {
      // Trigger native phone vibration if supported
      if (navigator.vibrate) {
        navigator.vibrate(35);
      }
      
      const toast = document.getElementById('toast');
      if (toast) {
        toast.textContent = `Opening ${appName}...`;
        toast.style.opacity = '1';
        setTimeout(() => {
          toast.style.opacity = '0';
        }, 1200);
      }
    }
  </script>
</body>
  </html>
